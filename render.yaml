services:
  - type: web
    name: attendance-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Database (set in Render Dashboard)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false

      # JWT Secrets (set in Render Dashboard)
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_QR_SECRET
        sync: false

      # Email (set in Render Dashboard)
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"

      # Spring Profile
      - key: SPRING_PROFILES_ACTIVE
        value: prod
