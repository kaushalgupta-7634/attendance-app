# Server Configuration (Supports Railway $PORT environment variable)
server.port=${PORT:8080}

# Spring Application Settings
spring.application.name=attendance

# Database Configuration with Environment Variable Support (Supports Railway injected MySQL credentials)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:attendance_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# H2 Console Configuration (Active when using default H2)
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration Properties (Supports APP_JWT_SECRET env var)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION:86400000}

# QR Token Configuration Properties (Supports APP_QR_SECRET env var)
app.qr.secret=${APP_QR_SECRET:8f93a1c2b3d4e5f678901234567890abcdef1234567890abcdef1234567890ab}
