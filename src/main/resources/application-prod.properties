# Production Configuration (PostgreSQL on Render)
# (DataSource is handled dynamically by DatabaseConfig class reading DATABASE_URL)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Timezone Configuration (Asia/Kolkata - IST)
spring.jackson.time-zone=Asia/Kolkata

# Disable SQL Script Seeding for PostgreSQL
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
