# Server Configuration (Supports Railway $PORT environment variable)
server.port=${PORT:8080}

# Spring Application Settings
spring.application.name=attendance

# Database Configuration (MySQL on Railway via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:attendance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# H2 Console (Disabled for MySQL)
# spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Timezone Configuration (Asia/Kolkata - IST)
spring.jackson.time-zone=Asia/Kolkata

# Disable SQL Script Initialization for MySQL (Hibernate ddl-auto handles table creation)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

