# Server Configuration (Supports Railway $PORT environment variable)
server.port=${PORT:8080}

# Spring Application Settings
spring.application.name=attendance

# Database Configuration (MySQL on Railway via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Console (Disabled for MySQL)
# spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Timezone Configuration (Asia/Kolkata - IST)
spring.jackson.time-zone=Asia/Kolkata

# Disable SQL Script Initialization for MySQL (Hibernate ddl-auto handles table creation)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Configuration Properties (Supports APP_JWT_SECRET env var)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION:86400000}

# QR Token Configuration Properties (Supports APP_QR_SECRET env var)
app.qr.secret=${APP_QR_SECRET:8f93a1c2b3d4e5f678901234567890abcdef1234567890abcdef1234567890ab}

# JavaMailSender / SMTP Configuration (Configured via environment variables MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD)
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:noreply@attendance.com}}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Attendance Scheduled Job Configuration (Default: once daily at midnight)
attendance.scheduler.cron=${ATTENDANCE_SCHEDULER_CRON:0 0 0 * * ?}
