# Server Configuration (Supports Railway $PORT environment variable)
server.port=${PORT:8080}

# Spring Application Settings
spring.application.name=attendance

# Database Configuration (MySQL on Railway via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER:subhod}
spring.datasource.password=${MYSQLPASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# H2 Console (Disabled for MySQL)
# spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Timezone Configuration (Asia/Kolkata - IST)
spring.jackson.time-zone=Asia/Kolkata

# Disable SQL Script Initialization for MySQL (Hibernate ddl-auto handles table creation)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Configuration Properties (Supports APP_JWT_SECRET env var)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION:86400000}

# QR Token Configuration Properties (Supports APP_QR_SECRET env var)
app.qr.secret=${APP_QR_SECRET:8f93a1c2b3d4e5f678901234567890abcdef1234567890abcdef1234567890ab}

# JavaMailSender / SMTP Configuration (Gmail SMTP Port 587 STARTTLS)
