<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Attendance Portal - Secure Login and Registration">
    <title>ATTENDX - Portal Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.05em;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .tab-switcher {
            display: flex;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.55rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-blue);
        }

        .form-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: var(--accent-blue-hover);
        }

        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
        }

        .alert-box.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
        }

        .alert-box.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #86efac;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon" style="background: transparent; box-shadow: none; border: none; padding: 0;">
                <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="attendxGlowLgn" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#0284c7" />
                      <stop offset="50%" stop-color="#2563eb" />
                      <stop offset="100%" stop-color="#10b981" />
                    </linearGradient>
                  </defs>
                  <rect x="10" y="10" width="80" height="80" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
                  <path d="M30 52 L42 64 L70 34" stroke="url(#attendxGlowLgn)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M70 64 L56 50" stroke="url(#attendxGlowLgn)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
                  <path d="M30 34 L44 48" stroke="url(#attendxGlowLgn)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
                </svg>
            </div>
            <h1 class="brand-title">ATTENDX</h1>
            <p class="brand-subtitle">Smart Geo-Fenced & QR Attendance System</p>
        </div>

        <div class="tab-switcher">
            <button type="button" id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button type="button" id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="loginUsername">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--accent-purple); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="loginSubmitBtn" class="submit-btn">Sign In to Dashboard</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="regName">Full Name</label>
                <input type="text" id="regName" class="form-input" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regUsername">Username</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address</label>
                <input type="email" id="regEmail" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPassword">Password</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regRole">Account Role</label>
                <select id="regRole" class="form-select" required>
                    <option value="STUDENT">Student</option>
                    <option value="TEACHER">Teacher</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="regClassName">Class / Department (Optional for Students)</label>
                <input type="text" id="regClassName" class="form-input" placeholder="e.g. BCA, BBA, CS101">
            </div>

            <div class="form-group">
                <label class="form-label" for="regSecurityPin">Create 4-Digit Security PIN (For Password Reset)</label>
                <input type="password" id="regSecurityPin" name="user_custom_pin_field" class="form-input" placeholder="Enter your 4-digit PIN (e.g. 1234)" maxlength="4" pattern="\d{4}" inputmode="numeric" autocomplete="new-password" value="" required>
            </div>

            <button type="submit" id="regSubmitBtn" class="submit-btn">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const alertBox = document.getElementById('alertBox');
            
            alertBox.style.display = 'none';

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
                const pinInput = document.getElementById('regSecurityPin');
                if (pinInput) pinInput.value = '';
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = msg;
            alertBox.className = 'alert-box ' + (isSuccess ? 'success' : 'error');
            alertBox.style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const pendingQr = sessionStorage.getItem('pendingQrToken') || getCookie('pendingQrToken');
            if (pendingQr) {
                const rememberedUser = localStorage.getItem('username') || getCookie('attendx_username');
                if (!rememberedUser && !localStorage.getItem('jwtToken') && !getCookie('attendx_student_token')) {
                    switchTab('register');
                    showAlert('📲 QR Code Scanned! New Student? Register your account below to mark Attendance automatically! (Already registered? Switch to Sign In)', true);
                } else {
                    switchTab('login');
                    if (rememberedUser) {
                        const uInput = document.getElementById('loginUsername');
                        if (uInput) uInput.value = rememberedUser;
                    }
                    showAlert('📲 QR Code Scanned! Sign in to mark your Attendance automatically.', true);
                }
            } else {
                const rememberedUser = localStorage.getItem('username') || getCookie('attendx_username');
                if (rememberedUser) {
                    const uInput = document.getElementById('loginUsername');
                    if (uInput && !uInput.value) uInput.value = rememberedUser;
                }
            }
        });

        function parseJwtPayload(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return {};
            }
        }

        function parseJwtRole(token) {
            return parseJwtPayload(token).role || null;
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
        }

        function getBrowserFingerprint() {
            try {
                const screenInfo = `${screen.width}x${screen.height}x${screen.colorDepth}`;
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                const hc = navigator.hardwareConcurrency || 1;
                const ua = navigator.userAgent || '';
                
                let canvasHash = '';
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '14px Arial';
                    ctx.fillText('AttendX_FP_Check', 2, 2);
                    canvasHash = canvas.toDataURL().slice(-30);
                } catch (e) {}

                const raw = `${screenInfo}_${tz}_${hc}_${canvasHash}_${ua.slice(0, 40)}`;
                let hash = 0;
                for (let i = 0; i < raw.length; i++) {
                    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                    hash |= 0;
                }
                return 'fp_' + Math.abs(hash).toString(36);
            } catch (e) {
                return 'fp_default';
            }
        }

        function getOrCreateDeviceId() {
            let devId = localStorage.getItem('attendx_device_id') || getCookie('attendx_device_id');
            if (!devId) {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    devId = 'dev_' + crypto.randomUUID();
                } else {
                    devId = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 10);
                }
            }
            localStorage.setItem('attendx_device_id', devId);
            setCookie('attendx_device_id', devId);
            return devId + '_' + getBrowserFingerprint();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const deviceId = getOrCreateDeviceId();

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Device-Id': deviceId
                    },
                    body: JSON.stringify({ username, password, deviceId })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || 'Invalid username or password.');
                }

                const data = await res.json();
                const payload = parseJwtPayload(data.accessToken);
                const role = payload.role || 'STUDENT';
                const name = payload.name || payload.sub || username;
                
                localStorage.setItem('jwtToken', data.accessToken);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', name);
                localStorage.setItem('username', payload.sub || username);

                setCookie('attendx_student_token', data.accessToken, 365);
                setCookie('attendx_user_role', role, 365);
                setCookie('attendx_username', payload.sub || username, 365);

                showAlert('Login successful! Redirecting...', true);

                setTimeout(() => {
                    if (role === 'ADMIN') {
                        window.location.href = '/admin-dashboard.html';
                    } else if (role === 'TEACHER') {
                        window.location.href = '/teacher-dashboard.html';
                    } else {
                        window.location.href = '/student-scan.html';
                    }
                }, 800);

            } catch (err) {
                showAlert(err.message || 'Login failed. Please check username and password.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Dashboard';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClassName').value.trim();
            const securityPin = document.getElementById('regSecurityPin').value.trim();

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, email, password, role, className, securityPin })
                });

                const regResText = await res.text();

                if (!res.ok) {
                    throw new Error(regResText || 'Registration failed');
                }

                if (role === 'TEACHER') {
                    showAlert(regResText || 'Registration successful! A 6-digit OTP has been sent to your email. Redirecting to verification page...', true);
                    setTimeout(() => {
                        window.location.href = '/verify.html?email=' + encodeURIComponent(email);
                    }, 1500);
                    return;
                }

                showAlert(regResText || 'Registration successful! Please check your email to verify your account before logging in.', true);
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                }, 1800);
                return;

                showAlert('Account registered successfully! Logging you in...', true);
                
                // Auto-login registered student to mark attendance seamlessly
                try {
                    const devId = getOrCreateDeviceId();
                    const loginRes = await fetch('/auth/login', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'X-Device-Id': devId
                        },
                        body: JSON.stringify({ username, password, deviceId: devId })
                    });
                    if (loginRes.ok) {
                        const loginData = await loginRes.json();
                        const payload = parseJwtPayload(loginData.accessToken);
                        const userRole = payload.role || role;
                        const userFullName = payload.name || name;

                        localStorage.setItem('jwtToken', loginData.accessToken);
                        localStorage.setItem('userRole', userRole);
                        localStorage.setItem('userName', userFullName);
                        localStorage.setItem('username', payload.sub || username);

                        setCookie('attendx_student_token', loginData.accessToken, 365);
                        setCookie('attendx_user_role', userRole, 365);
                        setCookie('attendx_username', payload.sub || username, 365);

                        setTimeout(() => {
                            if (userRole === 'ADMIN') {
                                window.location.href = '/admin-dashboard.html';
                            } else if (userRole === 'TEACHER') {
                                window.location.href = '/teacher-dashboard.html';
                            } else {
                                window.location.href = '/student-scan.html';
                            }
                        }, 600);
                        return;
                    }
                } catch (loginErr) {
                    console.warn("Auto login post registration failed, switching to login tab:", loginErr);
                }

                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                }, 1200);

            } catch (err) {
                showAlert(err.message || 'Failed to register account.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
