<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Attendance Portal - Secure Login and Registration">
    <title>Attendance System | Auth Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-border: #ef4444;
            --success-bg: rgba(34, 197, 94, 0.2);
            --success-border: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .tab-switcher {
            display: flex;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.75rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        .form-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-box.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
        }

        .alert-box.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #86efac;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
            </div>
            <h1 class="brand-title">Smart Attendance</h1>
            <p class="brand-subtitle">Location & QR Based Attendance System</p>
        </div>

        <div class="tab-switcher">
            <button type="button" id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button type="button" id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="loginUsername">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--accent-purple); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="loginSubmitBtn" class="submit-btn">Sign In to Dashboard</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="regName">Full Name</label>
                <input type="text" id="regName" class="form-input" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regUsername">Username</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address</label>
                <input type="email" id="regEmail" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPassword">Password</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regRole">Account Role</label>
                <select id="regRole" class="form-select" required>
                    <option value="STUDENT">Student</option>
                    <option value="TEACHER">Teacher</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="regClassName">Class / Department (Optional for Students)</label>
                <input type="text" id="regClassName" class="form-input" placeholder="e.g. BCA, BBA, CS101">
            </div>

            <button type="submit" id="regSubmitBtn" class="submit-btn">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const alertBox = document.getElementById('alertBox');
            
            alertBox.style.display = 'none';

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = msg;
            alertBox.className = 'alert-box ' + (isSuccess ? 'success' : 'error');
            alertBox.style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('pendingQrToken')) {
                showAlert('📲 QR Code Scanned! Sign in or Register below to mark your Attendance automatically.', true);
            }
        });

        function parseJwtPayload(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return {};
            }
        }

        function parseJwtRole(token) {
            return parseJwtPayload(token).role || null;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || 'Invalid username or password.');
                }

                const data = await res.json();
                const payload = parseJwtPayload(data.accessToken);
                const role = payload.role || 'STUDENT';
                const name = payload.name || payload.sub || username;
                
                localStorage.setItem('jwtToken', data.accessToken);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', name);
                localStorage.setItem('username', payload.sub || username);

                showAlert('Login successful! Redirecting...', true);

                setTimeout(() => {
                    if (role === 'ADMIN') {
                        window.location.href = '/admin-dashboard.html';
                    } else if (role === 'TEACHER') {
                        window.location.href = '/teacher-dashboard.html';
                    } else {
                        window.location.href = '/student-scan.html';
                    }
                }, 800);

            } catch (err) {
                showAlert(err.message || 'Login failed. Please check username and password.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Dashboard';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClassName').value.trim();

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, email, password, role, className })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || 'Registration failed');
                }

                showAlert('Account registered successfully! Logging you in...', true);
                
                // Auto-login registered student to mark attendance seamlessly
                try {
                    const loginRes = await fetch('/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    if (loginRes.ok) {
                        const loginData = await loginRes.json();
                        const payload = parseJwtPayload(loginData.accessToken);
                        const userRole = payload.role || role;
                        const userFullName = payload.name || name;

                        localStorage.setItem('jwtToken', loginData.accessToken);
                        localStorage.setItem('userRole', userRole);
                        localStorage.setItem('userName', userFullName);
                        localStorage.setItem('username', payload.sub || username);

                        setTimeout(() => {
                            if (userRole === 'ADMIN') {
                                window.location.href = '/admin-dashboard.html';
                            } else if (userRole === 'TEACHER') {
                                window.location.href = '/teacher-dashboard.html';
                            } else {
                                window.location.href = '/student-scan.html';
                            }
                        }, 600);
                        return;
                    }
                } catch (loginErr) {
                    console.warn("Auto login post registration failed, switching to login tab:", loginErr);
                }

                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                }, 1200);

            } catch (err) {
                showAlert(err.message || 'Failed to register account.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
