<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Classroom Location</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #0f172a; color: white; }
        .container { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #3b82f6; }
        button { background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #2563eb; }
        #status { margin-top: 20px; font-weight: bold; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Set Classroom Location</h2>
        <p>Please allow location access to set the classroom center for attendance.</p>
        <button id="setLocationBtn" onclick="setLocation()">Set My Location</button>
        <p id="status"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId');

        function setLocation() {
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('setLocationBtn');
            
            if (!sessionId) {
                statusEl.innerHTML = "Error: Session ID missing!";
                statusEl.className = "error";
                return;
            }

            if (navigator.geolocation) {
                statusEl.innerHTML = "Fetching location... please wait.";
                statusEl.className = "";
                btn.disabled = true;

                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    fetch(`/sessions/${sessionId}/set-location?lat=${lat}&lng=${lng}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('token') // If JWT is used.
                        }
                    })
                    .then(res => {
                        if (res.ok) {
                            statusEl.innerHTML = "Location Set Successfully! You can close this window.";
                            statusEl.className = "success";
                        } else {
                            statusEl.innerHTML = "Failed to set location. Are you logged in?";
                            statusEl.className = "error";
                            btn.disabled = false;
                        }
                    })
                    .catch(err => {
                        statusEl.innerHTML = "Network error occurred.";
                        statusEl.className = "error";
                        btn.disabled = false;
                    });
                }, (error) => {
                    statusEl.innerHTML = "Location access denied. Please allow GPS.";
                    statusEl.className = "error";
                    btn.disabled = false;
                }, { enableHighAccuracy: true });
            } else {
                statusEl.innerHTML = "Geolocation is not supported by this browser.";
                statusEl.className = "error";
            }
        }
    </script>
</body>
</html>
