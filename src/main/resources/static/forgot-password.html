<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --input-bg: #1f293d;
            --input-border: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-purple: #2563eb;
            --accent-indigo: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.5);
        }

        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .alert-box.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            display: block;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }

        .tab-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.25rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--input-border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 class="brand-title">Reset Password</h1>
            <p id="brandSubtitle" class="brand-subtitle">Choose your preferred reset method below.</p>
        </div>

        <div class="tab-switcher">
            <button type="button" id="tabPinBtn" class="tab-btn active" onclick="switchResetMethod('pin')">Security PIN</button>
            <button type="button" id="tabOtpBtn" class="tab-btn" onclick="switchResetMethod('otp')">Email OTP</button>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- INSTANT 4-DIGIT SECURITY PIN RESET FORM -->
        <form id="pinResetForm" onsubmit="handlePinReset(event)" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="pinUserOrEmail">Registered Username or Email</label>
                <input type="text" id="pinUserOrEmail" name="resetUser" class="form-input" placeholder="e.g. student@gmail.com or username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinInput">4-Digit Security PIN</label>
                <input type="password" id="pinInput" name="securityPinCode" class="form-input" placeholder="Enter your 4-digit PIN" required maxlength="12" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinNewPassword">New Password</label>
                <input type="password" id="pinNewPassword" name="newPass" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinConfirmPassword">Confirm New Password</label>
                <input type="password" id="pinConfirmPassword" name="confirmPass" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" id="pinSubmitBtn" class="submit-btn">Verify PIN & Set New Password</button>
        </form>

        <!-- OTP REQUEST FORM -->
        <form id="otpRequestForm" class="hidden" onsubmit="handleSendOtp(event)">
            <p class="brand-subtitle" style="margin-bottom: 1.25rem; text-align: left; line-height: 1.4;">
                Enter your username or email address, and we will send a 6-digit verification code to your registered email.
            </p>
            <div class="form-group">
                <label class="form-label" for="otpUserOrEmail">Registered Username or Email</label>
                <input type="text" id="otpUserOrEmail" class="form-input" placeholder="name@example.com or username" required>
            </div>
            <button type="submit" id="otpRequestBtn" class="submit-btn">Send Reset OTP to Email</button>
        </form>

        <!-- OTP RESET FORM -->
        <form id="otpResetForm" class="hidden" onsubmit="handleOtpReset(event)">
            <p class="brand-subtitle" style="margin-bottom: 1.25rem; text-align: left; line-height: 1.4; color: #86efac;">
                ✓ Verification OTP has been sent! Please check your inbox and enter the details below.
            </p>
            <div class="form-group">
                <label class="form-label" for="otpInput">6-Digit Email OTP Code</label>
                <input type="text" id="otpInput" class="form-input" style="letter-spacing: 0.3em; font-weight: 700; text-align: center;" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="otpNewPassword">New Password</label>
                <input type="password" id="otpNewPassword" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="otpConfirmPassword">Confirm New Password</label>
                <input type="password" id="otpConfirmPassword" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="otpResetBtn" class="submit-btn">Reset Password</button>
        </form>

        <a href="/login.html" class="back-link">← Back to Sign In</a>
    </div>

    <script>
        let lastRequestedEmail = '';

        function switchResetMethod(method) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';
            alertBox.className = 'alert-box';

            const pinForm = document.getElementById('pinResetForm');
            const reqForm = document.getElementById('otpRequestForm');
            const rstForm = document.getElementById('otpResetForm');

            const tabPin = document.getElementById('tabPinBtn');
            const tabOtp = document.getElementById('tabOtpBtn');

            if (method === 'pin') {
                pinForm.classList.remove('hidden');
                reqForm.classList.add('hidden');
                rstForm.classList.add('hidden');
                tabPin.classList.add('active');
                tabOtp.classList.remove('active');
            } else {
                pinForm.classList.add('hidden');
                reqForm.classList.remove('hidden');
                rstForm.classList.add('hidden');
                tabPin.classList.remove('active');
                tabOtp.classList.add('active');
            }
        }

        async function handlePinReset(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('pinSubmitBtn');
            const usernameOrEmail = document.getElementById('pinUserOrEmail').value.trim();
            const securityPin = document.getElementById('pinInput').value.trim();
            const newPassword = document.getElementById('pinNewPassword').value;
            const confirmPassword = document.getElementById('pinConfirmPassword').value;

            if (!usernameOrEmail || !securityPin) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter Username/Email and your 4-Digit Security PIN.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying PIN & Updating...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: usernameOrEmail,
                        securityPin: securityPin,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errorMessage = responseText;
                    try {
                        const parsed = JSON.parse(responseText);
                        if (parsed && parsed.message) {
                            errorMessage = parsed.message;
                        }
                    } catch (err) {}
                    throw new Error(errorMessage || 'Password reset failed.');
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `<strong>✅ Success!</strong> ${escapeHtml(responseText)}<br><span style="font-size: 0.8rem; display: inline-block; margin-top: 0.5rem;">Redirecting to sign in page in 3 seconds...</span>`;

                document.getElementById('pinResetForm').style.display = 'none';

                setTimeout(() => {
                    window.location.href = '/login.html?username=' + encodeURIComponent(usernameOrEmail);
                }, 3000);

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred during password reset.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify PIN & Set New Password';
            }
        }

        async function handleSendOtp(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('otpRequestBtn');
            const emailVal = document.getElementById('otpUserOrEmail').value.trim();

            if (!emailVal) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter your registered Username or Email.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending OTP...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailVal })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Failed to send OTP code.');
                }

                lastRequestedEmail = emailVal;

                // Switch to OTP verify form
                document.getElementById('otpRequestForm').classList.add('hidden');
                document.getElementById('otpResetForm').classList.remove('hidden');

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.textContent = data.message || 'Reset OTP has been sent successfully to your email!';

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'Failed to request password reset OTP.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset OTP to Email';
            }
        }

        async function handleOtpReset(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('otpResetBtn');
            const otpCode = document.getElementById('otpInput').value.trim();
            const newPassword = document.getElementById('otpNewPassword').value;
            const confirmPassword = document.getElementById('otpConfirmPassword').value;

            if (!otpCode || otpCode.length !== 6) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter a valid 6-digit OTP code.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting Password...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: otpCode,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errMsg = 'Failed to reset password.';
                    try {
                        const errData = JSON.parse(responseText);
                        if (errData && errData.message) errMsg = errData.message;
                    } catch (parseErr) {
                        if (responseText) errMsg = responseText;
                    }
                    throw new Error(errMsg);
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `<strong>✅ Success!</strong> ${escapeHtml(responseText)}<br><span style="font-size: 0.8rem; display: inline-block; margin-top: 0.5rem;">Redirecting to sign in page in 3 seconds...</span>`;

                document.getElementById('otpResetForm').classList.add('hidden');

                setTimeout(() => {
                    window.location.href = '/login.html?username=' + encodeURIComponent(lastRequestedEmail || '');
                }, 3000);

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred during password reset.';
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
