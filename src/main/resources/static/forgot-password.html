<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --input-bg: #1f293d;
            --input-border: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-purple: #2563eb;
            --accent-indigo: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.5);
        }

        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .alert-box.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            display: block;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 class="brand-title">Reset Your Password</h1>
            <p class="brand-subtitle">Enter your username or email along with your Security PIN / Master PIN to set a new password.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- INSTANT SECURITY PIN RESET FORM -->
        <form id="pinResetForm" onsubmit="handlePinReset(event)" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="pinUserOrEmail">Registered Username or Email</label>
                <input type="text" id="pinUserOrEmail" name="resetUser" class="form-input" placeholder="e.g. username or user@gmail.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinInput">Security PIN / Master PIN</label>
                <input type="password" id="pinInput" name="securityPinCode" class="form-input" placeholder="Enter 4-digit PIN or Master PIN" required maxlength="12" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinNewPassword">New Password</label>
                <input type="password" id="pinNewPassword" name="newPass" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinConfirmPassword">Confirm New Password</label>
                <input type="password" id="pinConfirmPassword" name="confirmPass" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" id="pinSubmitBtn" class="submit-btn">Verify PIN & Reset Password</button>
        </form>

        <a href="/login.html" class="back-link">← Back to Sign In</a>
    </div>

    <script>
        async function handlePinReset(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('pinSubmitBtn');
            const usernameOrEmail = document.getElementById('pinUserOrEmail').value.trim();
            const securityPin = document.getElementById('pinInput').value.trim();
            const newPassword = document.getElementById('pinNewPassword').value;
            const confirmPassword = document.getElementById('pinConfirmPassword').value;

            if (!usernameOrEmail || !securityPin) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter both Username/Email and your 4-Digit Security PIN.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying PIN & Updating...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: usernameOrEmail,
                        securityPin: securityPin,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errorMessage = responseText;
                    try {
                        const parsed = JSON.parse(responseText);
                        if (parsed && parsed.message) {
                            errorMessage = parsed.message;
                        }
                    } catch (err) {}
                    throw new Error(errorMessage || 'Password reset failed.');
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `<strong>✅ Success!</strong> ${escapeHtml(responseText)}<br><span style="font-size: 0.8rem; display: inline-block; margin-top: 0.5rem;">Redirecting to login page in 3 seconds...</span>`;

                document.getElementById('pinResetForm').style.display = 'none';

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred during password reset.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify PIN & Reset Password';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
