<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTENDX - Reset Password via Email OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-purple: #2563eb;
            --accent-indigo: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-purple);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 900;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .otp-input {
            letter-spacing: 0.35em;
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.5);
        }

        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .alert-box.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            display: block;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-purple);
        }

        .resend-container {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .resend-btn {
            background: none;
            border: none;
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 class="brand-title">Reset Your Password</h1>
            <p id="brandSubtitle" class="brand-subtitle">Choose Private Security PIN (Instant) or Email OTP.</p>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 1.5rem; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 10px; border: 1px solid var(--input-border);">
            <button type="button" id="tabPinBtn" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--accent-purple); color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;" onclick="switchResetTab('PIN')">🔑 Security PIN (Instant)</button>
            <button type="button" id="tabOtpBtn" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s;" onclick="switchResetTab('OTP')">✉️ Email OTP</button>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- FORM 1: PRIVATE SECURITY PIN RESET -->
        <form id="pinResetForm" onsubmit="handlePinReset(event)">
            <div class="form-group">
                <label class="form-label" for="pinUserOrEmail">Registered Username or Email</label>
                <input type="text" id="pinUserOrEmail" class="form-input" placeholder="e.g. username or user@gmail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="pinInput">4-Digit Private Security PIN</label>
                <input type="password" id="pinInput" class="form-input" placeholder="Enter 4-digit PIN set at signup" required maxlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinNewPassword">New Password</label>
                <input type="password" id="pinNewPassword" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="pinConfirmPassword">Confirm New Password</label>
                <input type="password" id="pinConfirmPassword" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="pinSubmitBtn" class="submit-btn">Verify PIN & Reset Password</button>
        </form>

        <!-- FORM 2: STEP 1 REQUEST OTP -->
        <form id="step1Form" style="display: none;" onsubmit="handleSendOtp(event)">
            <div class="form-group">
                <label class="form-label" for="emailInput">Registered Email Address or Username</label>
                <input type="text" id="emailInput" class="form-input" placeholder="e.g. user@example.com or username" required>
            </div>

            <button type="submit" id="sendOtpBtn" class="submit-btn">Send 6-Digit OTP to Email</button>
        </form>

        <!-- FORM 3: STEP 2 VERIFY OTP & SET NEW PASSWORD -->
        <form id="step2Form" style="display: none;" onsubmit="handleVerifyOtpAndReset(event)">
            <div class="form-group">
                <label class="form-label" for="otpInput">6-Digit Email OTP Code</label>
                <input type="text" id="otpInput" class="form-input otp-input" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
            </div>

            <div class="form-group">
                <label class="form-label" for="newPasswordInput">New Password</label>
                <input type="password" id="newPasswordInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPasswordInput">Confirm New Password</label>
                <input type="password" id="confirmPasswordInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="resetBtn" class="submit-btn">Verify OTP & Reset Password</button>

            <div class="resend-container">
                Didn't receive the OTP code? <button type="button" class="resend-btn" onclick="resendOtp()">Resend OTP</button>
            </div>
        </form>

        <a href="/login.html" class="back-link">← Back to Sign In</a>
    </div>

    <script>
        let requestedUserOrEmail = '';

        function switchResetTab(mode) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';
            const tabPinBtn = document.getElementById('tabPinBtn');
            const tabOtpBtn = document.getElementById('tabOtpBtn');
            const pinResetForm = document.getElementById('pinResetForm');
            const step1Form = document.getElementById('step1Form');
            const step2Form = document.getElementById('step2Form');

            if (mode === 'PIN') {
                tabPinBtn.style.background = 'var(--accent-purple)';
                tabPinBtn.style.color = '#fff';
                tabOtpBtn.style.background = 'transparent';
                tabOtpBtn.style.color = 'var(--text-secondary)';
                pinResetForm.style.display = 'block';
                step1Form.style.display = 'none';
                step2Form.style.display = 'none';
                document.getElementById('brandSubtitle').textContent = 'Reset using your 4-digit Private Security PIN set during signup.';
            } else {
                tabOtpBtn.style.background = 'var(--accent-purple)';
                tabOtpBtn.style.color = '#fff';
                tabPinBtn.style.background = 'transparent';
                tabPinBtn.style.color = 'var(--text-secondary)';
                pinResetForm.style.display = 'none';
                step1Form.style.display = 'block';
                step2Form.style.display = 'none';
                document.getElementById('brandSubtitle').textContent = 'Enter your registered email address or username to receive a 6-digit OTP code.';
            }
        }

        async function handlePinReset(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('pinSubmitBtn');
            const usernameOrEmail = document.getElementById('pinUserOrEmail').value.trim();
            const securityPin = document.getElementById('pinInput').value.trim();
            const newPassword = document.getElementById('pinNewPassword').value;
            const confirmPassword = document.getElementById('pinConfirmPassword').value;

            if (!usernameOrEmail || !securityPin) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter both Username/Email and your 4-Digit Security PIN.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying PIN & Updating...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: usernameOrEmail,
                        securityPin: securityPin,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errorMessage = responseText;
                    try {
                        const parsed = JSON.parse(responseText);
                        if (parsed && parsed.message) {
                            errorMessage = parsed.message;
                        }
                    } catch (err) {}
                    throw new Error(errorMessage || 'Password reset failed.');
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `<strong>✅ Success!</strong> ${escapeHtml(responseText)}<br><span style="font-size: 0.8rem; display: inline-block; margin-top: 0.5rem;">Redirecting to login page in 3 seconds...</span>`;

                document.getElementById('pinResetForm').style.display = 'none';

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred during password reset.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify PIN & Reset Password';
            }
        }

        async function handleSendOtp(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('sendOtpBtn');
            const emailInput = document.getElementById('emailInput').value.trim();

            if (!emailInput) return;

            requestedUserOrEmail = emailInput;
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });

                const data = await res.json().catch(async () => {
                    const txt = await res.text();
                    return { success: res.ok, message: txt };
                });

                if (!res.ok || data.success === false) {
                    throw new Error(data.message || 'Failed to send OTP code.');
                }

                if (data.emailSent === false) {
                    alertBox.className = 'alert-box';
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'rgba(234, 179, 8, 0.2)';
                    alertBox.style.border = '1px solid #eab308';
                    alertBox.style.color = '#fef08a';
                    alertBox.innerHTML = `<strong>⚠️ SMTP Notice:</strong> ${escapeHtml(data.message || 'Email delivery failed.')}`;
                } else {
                    alertBox.className = 'alert-box success';
                    alertBox.style.display = 'block';
                    alertBox.innerHTML = `<strong>✅ OTP Sent!</strong><br>${escapeHtml(data.message || 'Check your registered email inbox for the 6-digit OTP code.')}`;
                }

                // Transition UI to Step 2
                document.getElementById('step1Form').style.display = 'none';
                document.getElementById('step2Form').style.display = 'block';
                document.getElementById('brandSubtitle').textContent = 'Enter the 6-digit OTP received in your email and set your new password.';
                document.getElementById('otpInput').focus();

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send 6-Digit OTP to Email';
            }
        }

        async function handleVerifyOtpAndReset(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('resetBtn');
            const otp = document.getElementById('otpInput').value.trim();
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (!otp || otp.length !== 6) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please enter a valid 6-digit numeric OTP code.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying OTP & Updating...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: otp,
                        otp: otp,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errorMessage = responseText;
                    try {
                        const parsed = JSON.parse(responseText);
                        if (parsed && parsed.message) {
                            errorMessage = parsed.message;
                        }
                    } catch (e) {}
                    throw new Error(errorMessage || 'Invalid OTP code or password reset failed.');
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `<strong>Success!</strong> ${escapeHtml(responseText)}<br><span style="font-size: 0.8rem; display: inline-block; margin-top: 0.5rem;">Redirecting to login page in 3 seconds...</span>`;

                document.getElementById('step2Form').style.display = 'none';

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);

            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred during password reset.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify OTP & Reset Password';
            }
        }

        function resendOtp() {
            if (requestedUserOrEmail) {
                document.getElementById('emailInput').value = requestedUserOrEmail;
            }
            document.getElementById('step2Form').style.display = 'none';
            document.getElementById('step1Form').style.display = 'block';
            document.getElementById('brandSubtitle').textContent = 'Enter your registered email address or username to receive a 6-digit OTP code.';
            document.getElementById('alertBox').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
