<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Smart Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -5px rgba(139, 92, 246, 0.5);
        }

        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .alert-box.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            display: block;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-purple);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <h1 class="brand-title">Set New Password</h1>
            <p class="brand-subtitle">Enter your new account password below.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
            <div class="form-group" id="tokenGroup" style="display: none;">
                <label class="form-label" for="resetTokenInput">Reset Token</label>
                <input type="text" id="resetTokenInput" class="form-input" placeholder="Enter reset token UUID">
            </div>

            <div class="form-group">
                <label class="form-label" for="newPasswordInput">New Password</label>
                <input type="password" id="newPasswordInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPasswordInput">Confirm New Password</label>
                <input type="password" id="confirmPasswordInput" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Reset Password</button>
        </form>

        <a href="/login.html" class="back-link">← Back to Sign In</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token');

        if (!token) {
            document.getElementById('tokenGroup').style.display = 'block';
            document.getElementById('resetTokenInput').required = true;
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('submitBtn');
            const activeToken = token || document.getElementById('resetTokenInput').value.trim();
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (!activeToken) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = 'Please provide a valid password reset token.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating Password...';
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: activeToken,
                        newPassword: newPassword
                    })
                });

                const responseText = await res.text();

                if (!res.ok) {
                    let errMsg = 'Failed to reset password.';
                    try {
                        const errData = JSON.parse(responseText);
                        if (errData && errData.message) errMsg = errData.message;
                    } catch (parseErr) {
                        if (responseText) errMsg = responseText;
                    }
                    throw new Error(errMsg);
                }

                alertBox.className = 'alert-box success';
                alertBox.style.display = 'block';
                alertBox.textContent = responseText || 'Password reset successfully! Redirecting to login...';

                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.style.display = 'block';
                alertBox.textContent = err.message || 'An error occurred. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
